repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: secretscan
        name: secretscan
        entry: python3 -m cdc_lab.secretscan
        language: system
        pass_filenames: false
        always_run: true
